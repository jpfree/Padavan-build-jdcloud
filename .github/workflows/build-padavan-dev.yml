# ------------------------------------------------------------
# Padavan 编译工作流 (最终修正版)
# 修正点: 
# 1. fakeroot 拼写确认为 f-a-k-e-r-o-o-t
# 2. 在 clear_tree 之前删除问题目录 (防止 clear_tree 报错)
# 3. 在 clear_tree 之后再次确认并修复 user/Makefile
# ------------------------------------------------------------
name: Build Padavan dev
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装依赖 (fakerroot -> fakeroot)
      - name: Install build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config \
            zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget \
            liblz4-dev

      # 3. 拉取源码
      - name: Clone Padavan source
        env:
          KERNEL: 3.4
        run: |
          if [ "$KERNEL" = "4.4" ]; then
            git clone --depth=1 https://github.com/MeIsReallyBa/padavan-4.4.git /opt/rt-n56u
          else
            git clone --depth=1 https://github.com/jpfree/rt-n56u.git /opt/rt-n56u
          fi
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images/

      # 4. 【关键】在 clear_tree 之前先删除问题目录
      # 这样 clear_tree 就不会尝试去 clean 这些没有 Makefile 的目录
      - name: Remove problematic dirs BEFORE clear_tree
        run: |
          cd /opt/rt-n56u/trunk
          rm -rf user/openvpn user/skipdbv2 user/xTun user/smartdns user/redsocks

      # 5. 生成 .config (禁用插件)
      - name: Prepare .config
        env:
          TNAME: YK-L1
          KERNEL: 3.4
        run: |
          cd /opt/rt-n56u/trunk
          cp -f configs/templates/$TNAME.config .config
          # 禁用所有相关选项
          for opt in OPENVPN SHADOWSOCKS SSSERVER RPL2TP SOFTETHERVPN_CLIENT SOFTETHERVPN_SERVER SOFTETHERVPN_CMD SKIPDBV2 XTUN MENTOHUST SCUTCLIENT DNSFORWARDER ADBYBY FRPC FRPS TUNSAFE ALIDDNS SMARTDNS SRELAY LPRD TCPDUMP HDPARM SMBD SMBD36 FTPD EAP_PEAP DDNS_SSL OPENSSL_EC XUPNPD FFMPEG_NEW ARIA ARIA_WEB_CONTROL DOGCOM VLMCSD TTYD HTOP NANO IPERF3 MTR FAT EXT2 EXT3 IPSET NFSD NFSC CIFS; do
            sed -i "s/^CONFIG_FIRMWARE_INCLUDE_${opt}=.*/CONFIG_FIRMWARE_INCLUDE_${opt}=n/" .config || true
            sed -i "s/^CONFIG_FIRMWARE_ENABLE_${opt}=.*/CONFIG_FIRMWARE_ENABLE_${opt}=n/" .config || true
          done
          echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y" >> .config
          cp .config linux-3.4.x/.config

      # 6. 清理旧产物 (此时已没有问题目录，不会报错)
      - name: Clean old build artefacts
        run: |
          cd /opt/rt-n56u/trunk
          sudo ./clear_tree || true

      # 7. 【双重保险】clear_tree 后再次修复 user/Makefile
      - name: Fix user/Makefile after clear_tree
        run: |
          cd /opt/rt-n56u/trunk
          # 确保这些目录在 user/Makefile 中被列入 dir_n
          for d in openvpn skipdbv2 xTun smartdns redsocks; do
            sed -i "/^dir_y += $d/d" user/Makefile || true
            if ! grep -q "^dir_n += $d" user/Makefile; then
              echo "dir_n += $d" >> user/Makefile
            fi
          done

      # 8. 编译
      - name: Build Firmware
        run: |
          cd /opt/rt-n56u/trunk
          sudo make V=1 -j$(nproc)

      # 9. 收集产物
      - name: Collect firmware
        run: |
          sudo mv -f images/*.trx /opt/images/ 2>/dev/null || true

      # 10. 上传
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-${{ env.TNAME }}-dev
          path: /opt/images/*.trx
          if-no-files-found: error

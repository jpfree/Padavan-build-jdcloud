# ------------------------------------------------------------
# Padavan 编译工作流 (绝对时序修正版)
# 核心逻辑：
# 1. 拉取源码 -> 2. 准备配置 -> 3. clear_tree (恢复现场) -> 4. 立即修改 Makefile 并删除目录 -> 5. 编译
# 确保修改操作发生在 clear_tree 之后，make 之前！
# ------------------------------------------------------------
name: Build Padavan dev
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags: 
    - 'v*'
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装依赖 (fakeroot 拼写已确认无误)
      - name: Install build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config \
            zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget \
            liblz4-dev

      # 3. 拉取源码
      - name: Clone Padavan source
        env:
          KERNEL: 3.4
        run: |
          if [ "$KERNEL" = "4.4" ]; then
            git clone --depth=1 https://github.com/MeIsReallyBa/padavan-4.4.git /opt/rt-n56u
          else
            git clone --depth=1 https://github.com/jpfree/rt-n56u.git /opt/rt-n56u
          fi
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images/

      # 4. 生成 .config (只处理配置，不动 Makefile)
      - name: Prepare .config
        env:
          TNAME: YK-L1
          KERNEL: 3.4
        run: |
          set -e
          cd /opt/rt-n56u/trunk
          cp -f configs/templates/$TNAME.config .config
          
          # 禁用所有不需要的插件配置
          for opt in OPENVPN SHADOWSOCKS SSSERVER RPL2TP SOFTETHERVPN_CLIENT SOFTETHERVPN_SERVER SOFTETHERVPN_CMD SKIPDBV2 XTUN MENTOHUST SCUTCLIENT DNSFORWARDER ADBYBY FRPC FRPS TUNSAFE ALIDDNS SMARTDNS SRELAY LPRD TCPDUMP HDPARM SMBD SMBD36 FTPD EAP_PEAP DDNS_SSL OPENSSL_EC XUPNPD FFMPEG_NEW ARIA ARIA_WEB_CONTROL DOGCOM VLMCSD TTYD HTOP NANO IPERF3 MTR REDSOCKS FAT EXT2 EXT3 IPSET NFSD NFSC CIFS; do
            sed -i "s/^CONFIG_FIRMWARE_INCLUDE_${opt}=.*/CONFIG_FIRMWARE_INCLUDE_${opt}=n/" .config || true
            sed -i "s/^CONFIG_FIRMWARE_ENABLE_${opt}=.*/CONFIG_FIRMWARE_ENABLE_${opt}=n/" .config || true
            echo "CONFIG_FIRMWARE_INCLUDE_${opt}=n" >> .config
            echo "CONFIG_FIRMWARE_ENABLE_${opt}=n" >> .config
          done
          echo "CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y" >> .config
          
          # 同步到内核
          cp .config linux-3.4.x/.config

      # 5. 清理旧产物 (让它恢复所有原始文件)
      - name: Clear tree (Restore original state)
        run: |
          cd /opt/rt-n56u/trunk
          # 这里会恢复所有的 Makefile 和目录结构
          sudo ./clear_tree || true

      # 6. 【关键步骤】在 clear_tree 之后，make 之前，立即修改！
      - name: Patch Makefile and Remove Dirs (CRITICAL STEP)
        run: |
          cd /opt/rt-n56u/trunk
          
          # A. 物理删除目录 (防止 make 进入报错)
          rm -rf user/openvpn user/skipdbv2 user/xTun user/smartdns user/redsocks
          
          # B. 暴力修改 user/Makefile (此时修改的是 clear_tree 恢复后的最终版本)
          # 将 dir_y (编译) 改为 dir_n (不编译)
          sed -i 's/^dir_y += openvpn/dir_n += openvpn/' user/Makefile
          sed -i 's/^dir_y += skipdbv2/dir_n += skipdbv2/' user/Makefile
          sed -i 's/^dir_y += xTun/dir_n += xTun/' user/Makefile
          sed -i 's/^dir_y += smartdns/dir_n += smartdns/' user/Makefile
          sed -i 's/^dir_y += redsocks/dir_n += redsocks/' user/Makefile
          
          # C. 再次确认 (双重保险)
          grep "dir_n += openvpn" user/Makefile || echo "dir_n += openvpn" >> user/Makefile
          grep "dir_n += skipdbv2" user/Makefile || echo "dir_n += skipdbv2" >> user/Makefile
          grep "dir_n += xTun" user/Makefile || echo "dir_n += xTun" >> user/Makefile

      # 7. 正式编译
      - name: Build Firmware
        run: |
          cd /opt/rt-n56u/trunk
          # 此时 user/Makefile 已修改，目录已删除，应该不会再报错了
          sudo make V=1 -j$(nproc)

      # 8. 收集产物
      - name: Collect firmware
        run: |
          sudo mv -f images/*.trx /opt/images/ 2>/dev/null || true

      # 9. 上传
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-${{ env.TNAME }}-dev
          path: /opt/images/*.trx
          if-no-files-found: error

# ------------------------------------------------------------
# Padavan 编译工作流（彻底剔除 OpenVPN、skipdbv2、xTun 等插件）
# 修正点：fakeroot 拼写已确认为 fakeroot (无多余字符)
# ------------------------------------------------------------
name: Build Padavan dev

on:
  workflow_dispatch: # 手动点击 Run workflow
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-22.04
    # 只允许仓库所有者自己触发，防止他人滥用
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      # ----------------------------------------------------
      # 1️⃣ 检出代码
      # ----------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 2️⃣ 安装编译所需依赖
      # 重点修正：fakeroot (正确拼写: f-a-k-e-r-o-o-t)
      # ----------------------------------------------------
      - name: Install build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config \
            zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget \
            liblz4-dev

      # ----------------------------------------------------
      # 3️⃣ 拉取 Padavan 源码并准备交叉编译链
      # ----------------------------------------------------
      - name: Clone Padavan source
        env:
          KERNEL: 3.4 # 如需 4.4 改成 4.4
        run: |
          if [ "$KERNEL" = "4.4" ]; then
            git clone --depth=1 https://github.com/MeIsReallyBa/padavan-4.4.git /opt/rt-n56u
          else
            git clone --depth=1 https://github.com/jpfree/rt-n56u.git /opt/rt-n56u
          fi
          # 下载交叉工具链
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images/

      # ----------------------------------------------------
      # 4️⃣ 删除所有我们根本不想编译的插件目录
      # (避免 clear_tree/clean 进入不存在的 Makefile)
      # ----------------------------------------------------
      - name: Remove unwanted plugin directories
        run: |
          cd /opt/rt-n56u/trunk
          rm -rf user/openvpn user/skipdbv2 user/xTun

      # ----------------------------------------------------
      # 5️⃣ 生成 .config 并一次性把所有不需要的插件设为 n
      # ----------------------------------------------------
      - name: Prepare .config (disable VPN & all unwanted plugins)
        env:
          TNAME: YK-L1 # 请按实际型号修改
          KERNEL: 3.4
        run: |
          set -e
          cd /opt/rt-n56u/trunk

          # ① 复制官方模板
          if [ ! -f configs/templates/$TNAME.config ]; then
            echo "模板 configs/templates/$TNAME.config 未找到"
            exit 1
          fi
          cp -f configs/templates/$TNAME.config .config

          # ② 禁用所有会把 OpenVPN 拉进来的选项
          for opt in \
            OPENVPN SHADOWSOCKS SSSERVER RPL2TP \
            SOFTETHERVPN_CLIENT SOFTETHERVPN_SERVER SOFTETHERVPN_CMD \
            SKIPDBV2 XTUN ; do
            if grep -q "^CONFIG_FIRMWARE_INCLUDE_${opt}=" .config; then
              sed -i "s/^CONFIG_FIRMWARE_INCLUDE_${opt}=.*/CONFIG_FIRMWARE_INCLUDE_${opt}=n/" .config
            else
              echo "CONFIG_FIRMWARE_INCLUDE_${opt}=n" >> .config
            fi
          done

          # ③ 剔除其余所有我们不想要的插件（一次写成 =n，防止遗漏）
          PLUGINS="MENTOHUST SCUTCLIENT DNSFORWARDER ADBYBY FRPC FRPS TUNSAFE \
            ALIDDNS SMARTDNS SRELAY LPRD TCPDUMP HDPARM SMBD SMBD36 \
            FTPD EAP_PEAP DDNS_SSL OPENSSL_EC XUPNPD FFMPEG_NEW \
            ARIA ARIA_WEB_CONTROL DOGCOM VLMCSD TTYD HTOP NANO \
            IPERF3 MTR"
          for p in $PLUGINS; do
            if grep -q "^CONFIG_FIRMWARE_INCLUDE_${p}=" .config; then
              sed -i "s/^CONFIG_FIRMWARE_INCLUDE_${p}=.*/CONFIG_FIRMWARE_INCLUDE_${p}=n/" .config
            else
              echo "CONFIG_FIRMWARE_INCLUDE_${p}=n" >> .config
            fi
          done

          # ---- 文件系统 / 基础库（全部置 n）----
          for opt in FAT EXT2 EXT3 IPSET NFSD NFSC CIFS; do
            if grep -q "^CONFIG_FIRMWARE_ENABLE_${opt}=" .config; then
              sed -i "s/^CONFIG_FIRMWARE_ENABLE_${opt}=.*/CONFIG_FIRMWARE_ENABLE_${opt}=n/" .config
            else
              echo "CONFIG_FIRMWARE_ENABLE_${opt}=n" >> .config
            fi
          done

          # ---- 必须保留的 OpenSSL‑EXE（否则会报缺失）----
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=.*/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/' .config

          # --------------------------------------------------
          # 把 .config 复制到内核目录（防止 “.config not found”）
          # --------------------------------------------------
          cp .config linux-3.4.x/.config

      # ----------------------------------------------------
      # 6️⃣ 清理旧产物（对 libssl 的 distclean 错误做容忍）
      # ----------------------------------------------------
      - name: Clean old build artefacts
        run: |
          cd /opt/rt-n56u/trunk
          # clear_tree 会调用 libssl 的 distclean（不存在），所以用 || true 忽略错误
          sudo ./clear_tree || true

      # ----------------------------------------------------
      # 7️⃣ 正式编译（此时已经没有 openvpn / skipdbv2 / xTun 目录）
      # ----------------------------------------------------
      - name: Build Padavan firmware
        run: |
          cd /opt/rt-n56u/trunk
          sudo make V=1 -j$(nproc)

      # ----------------------------------------------------
      # 8️⃣ 把生成的 *.trx 固件搬到统一目录，供后面的 artifact 收集
      # ----------------------------------------------------
      - name: Collect firmware files
        run: |
          sudo mv -f images/*.trx /opt/images/ 2>/dev/null || true

      # ----------------------------------------------------
      # 9️⃣ 上传编译产物（若没有 .trx 会直接报错）
      # ----------------------------------------------------
      - name: Upload Padavan firmware
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-${{ env.TNAME }}-dev
          path: /opt/images/*.trx
          if-no-files-found: error

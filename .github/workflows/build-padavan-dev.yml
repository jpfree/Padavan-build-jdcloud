name: Build Padavan YK‑L1 (no VPN)

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget liblz4-dev

      - name: Clone Padavan source
        env:
          KERNEL: 3.4
        run: |
          if [ "$KERNEL" = "4.4" ]; then
            git clone --depth=1 https://github.com/MeIsReallyBa/padavan-4.4.git /opt/rt-n56u
          else
            git clone --depth=1 https://github.com/jpfree/rt-n56u.git /opt/rt-n56u
          fi
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images

      - name: Build Firmware (no VPN)
        env:
          TNAME: YK-L1       # 目标型号
          KERNEL: 3.4
        run: |
          cd /opt/rt-n56u/trunk

          # --------- 1️⃣ 复制模板 ----------
          cp -f configs/templates/$TNAME.config .config

          # --------- 2️⃣ 强制禁用所有 VPN ----------
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_OPENVPN=.*/CONFIG_FIRMWARE_INCLUDE_OPENVPN=n/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=.*/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SSSERVER=.*/CONFIG_FIRMWARE_INCLUDE_SSSERVER=n/' .config
          # 如需禁用其他 VPN 相关选项，可继续追加:
          # sed -i 's/^CONFIG_FIRMWARE_INCLUDE_EAP_PEAP=.*/CONFIG_FIRMWARE_INCLUDE_EAP_PEAP=n/' .config

          # --------- 3️⃣ 删除不需要的其它插件 ----------
          sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ADBYBY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
          # ……（保持你原来的删除列表即可）

          # --------- 4️⃣ 调试信息 ----------
          echo "=== .config 中的关键 VPN 选项 ==="
          grep -E 'CONFIG_FIRMWARE_INCLUDE_(OPENVPN|SHADOWSOCKS|SSSERVER)' .config || true

          # --------- 5️⃣ 锁定配置 ----------
          sudo make oldconfig   # 确保上一步写的 =n 不被默认值覆盖

          # --------- 6️⃣ 编译 ----------
          sudo make -j$(nproc)

          # --------- 7️⃣ 收集固件 ----------
          mkdir -p /opt/images
          cp -f images/*.trx /opt/images/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YK-L1-no-vpn
          path: /opt/images/*.trx
          if-no-files-found: error

name: Build Padavan dev

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags: ['v*']
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      # ------------------------------------------------------------
      # 1️⃣ 检出代码
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2️⃣ 安装全部编译依赖（已包括 liblz4-dev）
      # ------------------------------------------------------------
      - name: Installation environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config \
            zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget \
            liblz4-dev               # ← 解决 lz4.h 缺失

      # ------------------------------------------------------------
      # 3️⃣ 下载 Padavan 源码并准备交叉编译链
      # ------------------------------------------------------------
      - name: Clone source code
        env:
          KERNEL: 3.4
        run: |
          if [ "$KERNEL" = "4.4" ]; then
            git clone --depth=1 https://github.com/MeIsReallyBa/padavan-4.4.git /opt/rt-n56u
          else
            git clone --depth=1 https://github.com/jpfree/rt-n56u.git /opt/rt-n56u
          fi
          cd /opt/rt-n56u/toolchain-mipsel
          sh dl_toolchain.sh
          mkdir -p /opt/images

      # ------------------------------------------------------------
      # 4️⃣ 生成 .config 并强制关闭所有会把 OpenVPN 拉进来的选项
      # ------------------------------------------------------------
      - name: Build Firmware (no‑VPN)
        env:
          TNAME: YK-L1
          KERNEL: 3.4
        run: |
          set -e
          cd /opt/rt-n56u/trunk

          # ① 复制模板
          if [ ! -f configs/templates/$TNAME.config ]; then
            echo "configs/templates/$TNAME.config not found"
            exit 1
          fi
          cp -f configs/templates/$TNAME.config .config

          # ② 把所有可能触发 openvpn 的选项写成 n
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_OPENVPN=.*/CONFIG_FIRMWARE_INCLUDE_OPENVPN=n/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=.*/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SSSERVER=.*/CONFIG_FIRMWARE_INCLUDE_SSSERVER=n/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_RPL2TP=.*/CONFIG_FIRMWARE_INCLUDE_RPL2TP=n/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT=.*/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT=n/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER=.*/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER=n/' .config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD=.*/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD=n/' .config

          # ③ 其它你已经决定要删除的插件（保持不变）
          sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ADBYBY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMARTDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config

          # ④ 打开 SSL‑EXE（仍然需要）
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=.*/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/' .config

          # ⑤（可选）打印检查，确保所有 VPN 选项都是 n
          echo "=== .config 中的 VPN 开关（应全部为 n） ==="
          grep -E 'CONFIG_FIRMWARE_INCLUDE_(OPENVPN|SHADOWSOCKS|SSSERVER|RPL2TP|SOFTETHERVPN)' .config || echo "(none – all are n)"
          echo "=== kernel_config 中的 PPP / PPTP / L2TP 开关 ==="
          KERNEL_CFG=\"configs/boards/$TNAME/kernel_config\"
          if [ -f \"$KERNEL_CFG\" ]; then
            grep -E 'CONFIG_(PPP|PPTP|L2TP)' \"$KERNEL_CFG\" || echo "(none – all are n)"
          fi

          # ⑥ 清理旧产物并正式编译（V=1 打印完整命令，便于后期定位）
          sudo ./clear_tree
          sudo make V=1 -j$(nproc)

          # ⑦ 把固件搬到 /opt/images，后面的 upload‑artifact 能收集到
          sudo mv -f images/*.trx /opt/images/

      # ------------------------------------------------------------
      # 5️⃣ 上传编译好的固件（如果没有产物会直接报错）
      # ------------------------------------------------------------
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-${{ env.TNAME }}-dev
          path: /opt/images/*.trx
          if-no-files-found: error

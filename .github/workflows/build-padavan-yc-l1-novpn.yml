name: Build Padavan YK‑L1 (no VPN)

on:
  push:
    tags:
      - 'v*'               # 例如 v20240430
  release:
    types: [published]
  workflow_dispatch:
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      # ------------------------------------------------------------
      # 1️⃣ Checkout & install dependencies
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@master

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

      # ------------------------------------------------------------
      # 2️⃣ Clone Padavan source (rt‑n56u)
      # ------------------------------------------------------------
      - name: Clone Padavan source
        env:
          KERNEL: 3.4
        run: |
          if [ "$KERNEL" = "4.4" ]; then
            git clone --depth=1 https://github.com/MeIsReallyBa/padavan-4.4.git /opt/rt-n56u
          else
            git clone --depth=1 https://github.com/jpfree/rt-n56u.git /opt/rt-n56u
          fi
          cd /opt/rt-n56u/toolchain-mipsel && sh dl_toolchain.sh
          mkdir -p /opt/images/

      # ------------------------------------------------------------
      # 3️⃣ Prepare a VPN‑free .config (critical part)
      # ------------------------------------------------------------
      - name: Prepare firmware config (disable every VPN feature)
        env:
          TNAME: YK-L1
        run: |
          cd /opt/rt-n56u/trunk

          # ── a) 在模板里把所有 VPN 选项直接改成 n（在复制前完成）
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_OPENVPN=.*/CONFIG_FIRMWARE_INCLUDE_OPENVPN=n/' configs/templates/${TNAME}.config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=.*/CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n/' configs/templates/${TNAME}.config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_RPL2TP=.*/CONFIG_FIRMWARE_INCLUDE_RPL2TP=n/' configs/templates/${TNAME}.config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT=.*/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT=n/' configs/templates/${TNAME}.config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER=.*/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER=n/' configs/templates/${TNAME}.config
          sed -i 's/^CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD=.*/CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD=n/' configs/templates/${TNAME}.config

          # ── b) 复制已经改成 n 的模板
          cp -f configs/templates/${TNAME}.config .config

          # ── c) 删除原 workflow 已经去掉的其它插件
          sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SSSERVER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ADBYBY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMARTDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_HTOP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOCAT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD/d' .config

          # ── d) **关键**：改写内核层 VPN（PPP / PPTP / L2TP / TUN）
          KERNEL_CFG="configs/boards/${TNAME}/kernel-3.4.x.config"
          if [ -f "$KERNEL_CFG" ]; then
            # 删除可能已存在的行
            sed -i '/CONFIG_PPP/d'   "$KERNEL_CFG"
            sed -i '/CONFIG_PPTP/d'  "$KERNEL_CFG"
            sed -i '/CONFIG_L2TP/d' "$KERNEL_CFG"
            sed -i '/CONFIG_TUN/d'   "$KERNEL_CFG"

            # **显式写 n**（即使文件里根本没有这些行也会新增）
            echo "CONFIG_PPP=n"        >> "$KERNEL_CFG"
            echo "CONFIG_PPP_MPPE=n"   >> "$KERNEL_CFG"
            echo "CONFIG_PPTP=n"       >> "$KERNEL_CFG"
            echo "CONFIG_L2TP=n"        >> "$KERNEL_CFG"
            echo "CONFIG_TUN=n"        >> "$KERNEL_CFG"

            # 让 Padavan 使用我们编辑后的文件（复制成默认名字）
            cp "$KERNEL_CFG" "configs/boards/${TNAME}/kernel_config"
          fi

      # ------------------------------------------------------------
      # 4️⃣ Pre‑build sanity check (fail fast if any =y remains)
      # ------------------------------------------------------------
      - name: Pre‑build VPN config sanity check
        env:
          TNAME: YK-L1
        run: |
          cd /opt/rt-n56u/trunk
          echo "=== Pre‑build .config VPN check ==="
          grep -E 'CONFIG_FIRMWARE_INCLUDE_(OPENVPN|SHADOWSOCKS|RPL2TP|SOFTETHERVPN)=y' .config && \
            { echo "❌ VPN option still set to y in .config!"; exit 1; } || \
            echo "✅ .config 已全部是 n"

          echo "=== Pre‑build kernel_config VPN check ==="
          grep -E 'CONFIG_(PPP|PPTP|L2TP|TUN)=y' "configs/boards/${TNAME}/kernel_config" && \
            { echo "❌ Kernel VPN flag still y!"; exit 1; } || \
            echo "✅ kernel_config 已全部是 n"

      # ------------------------------------------------------------
      # 5️⃣ Clean any previous build artefacts (clear_tree)
      # ------------------------------------------------------------
      - name: Clean previous build
        run: |
          cd /opt/rt-n56u/trunk
          chmod +x clear_tree
          ./clear_tree

      # ------------------------------------------------------------
      # 6️⃣ Build the firmware (must run under fakeroot)
      # ------------------------------------------------------------
      - name: Build firmware (no VPN)
        env:
          TNAME: YK-L1
        run: |
          cd /opt/rt-n56u/trunk
          chmod +x build_firmware_modify
          fakeroot ./build_firmware_modify $TNAME 0   # 0 = release (no debug)

      # ------------------------------------------------------------
      # 7️⃣ Remove any leftover VPN binaries (extra safety)
      # ------------------------------------------------------------
      - name: Remove any VPN binaries from the image (just in case)
        run: |
          find /opt/rt-n56u/trunk/images -type f \
            \( -iname "*openvpn*" -o -iname "*pptp*" -o -iname "*l2tp*" -o -iname "*ppp*" -o -iname "*tun*" \) \
            -exec rm -f {} +

      # ------------------------------------------------------------
      # 8️⃣ Collect the generated *.trx file (absolute path)
      # ------------------------------------------------------------
      - name: Collect built firmware
        run: |
          mkdir -p /opt/images
          cp -f /opt/rt-n56u/trunk/images/*.trx /opt/images/

      # ------------------------------------------------------------
      # 9️⃣ Upload the artefact
      # ------------------------------------------------------------
      - name: Upload firmware artefact
        uses: actions/upload-artifact@v4
        with:
          name: YK-L1-no‑vpn
          path: /opt/images/*.trx
          if-no-files-found: error

      # ------------------------------------------------------------
      # 🔍 Post‑build verify VPN really disabled (final safety)
      # ------------------------------------------------------------
      - name: Post‑build verify VPN really disabled
        run: |
          for f in /opt/images/*.trx; do
            echo "=== 检查 $f 是否仍包含 VPN 关键字 ==="
            if strings "$f" | grep -i -E 'openvpn|pptp|l2tp|ppp|tun'; then
              echo "❌ $f 仍然包含 VPN 相关字样！"
              exit 1
            else
              echo "✅ $f 中未发现 VPN 关键字"
            fi
          done

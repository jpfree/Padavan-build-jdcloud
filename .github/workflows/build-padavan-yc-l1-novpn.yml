name: Build Padavan YK‑L1 (no VPN)

on:
  push:
    tags:
      - 'v*'               # e.g. v20240430
  release:
    types: [published]
  workflow_dispatch:
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
      # ------------------------------------------------------------
      # 1️⃣ Checkout & install dependencies
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@master

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config zlib1g-dev libgmp3-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget

      # ------------------------------------------------------------
      # 2️⃣ Clone Padavan source (rt‑n56u)
      # ------------------------------------------------------------
      - name: Clone Padavan source
        env:
          KERNEL: 3.4
        run: |
          if [ "$KERNEL" = "4.4" ]; then
            git clone --depth=1 https://github.com/MeIsReallyBa/padavan-4.4.git /opt/rt-n56u
          else
            git clone --depth=1 https://github.com/jpfree/rt-n56u.git /opt/rt-n56u
          fi
          cd /opt/rt-n56u/toolchain-mipsel && sh dl_toolchain.sh
          mkdir -p /opt/images/

      # ------------------------------------------------------------
      # 3️⃣ Prepare a VPN‑free .config
      # ------------------------------------------------------------
      - name: Prepare firmware config (disable every VPN feature)
        env:
          TNAME: YK-L1
        run: |
          cd /opt/rt-n56u/trunk

          # ---- ① copy the board‑specific template ---------------------------------
          cp -f configs/templates/${TNAME}.config .config

          # ---- ② force every VPN‑related option to "n" ---------------------------
          echo "CONFIG_FIRMWARE_INCLUDE_OPENVPN=n"      >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_RPL2TP=n"      >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CLIENT=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_SERVER=n" >> .config
          echo "CONFIG_FIRMWARE_INCLUDE_SOFTETHERVPN_CMD=n"    >> .config

          # ---- ③ delete the other options the original workflow stripped -----
          sed -i '/CONFIG_FIRMWARE_INCLUDE_MENTOHUST/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SCUTCLIENT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SSSERVER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_DNSFORWARDER/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ADBYBY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPC/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_FRPS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_TUNSAFE/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_ALIDDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMARTDNS/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SRELAY/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_HTOP/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SOCAT/d' .config
          sed -i '/CONFIG_FIRMWARE_INCLUDE_SMBD/d' .config

          # ---- ④ (可选) 删除内核层的 VPN 模块（PPP/PPTP/L2TP） ------------
          # 正确的内核配置文件路径是 kernel-3.4.x.config
          KERNEL_CFG="configs/boards/${TNAME}/kernel-3.4.x.config"
          if [ -f "$KERNEL_CFG" ]; then
            # 直接在原文件上做修改
            sed -i '/CONFIG_PPP/d'   "$KERNEL_CFG"
            sed -i '/CONFIG_PPTP/d'  "$KERNEL_CFG"
            sed -i '/CONFIG_L2TP/d'  "$KERNEL_CFG"
            # 把可能的 “=y” 强制改成 “=n”
            sed -i 's/^CONFIG_PPP=.*/CONFIG_PPP=n/'                 "$KERNEL_CFG" || true
            sed -i 's/^CONFIG_PPP_MPPE=.*/CONFIG_PPP_MPPE=n/'       "$KERNEL_CFG" || true
            sed -i 's/^CONFIG_PPTP=.*/CONFIG_PPTP=n/'               "$KERNEL_CFG" || true
            sed -i 's/^CONFIG_L2TP=.*/CONFIG_L2TP=n/'               "$KERNEL_CFG" || true

            # 为了让 Padavan 的 makefile 必然使用我们刚刚改好的文件，
            # 把它再拷贝成默认名字 “kernel_config”。（可省略，只是保险措施）
            cp "$KERNEL_CFG" "configs/boards/${TNAME}/kernel_config"
          fi

      # ------------------------------------------------------------
      # 4️⃣ Clean previous build artefacts (clear_tree)
      # ------------------------------------------------------------
      - name: Clean previous build
        run: |
          cd /opt/rt-n56u/trunk
          chmod +x clear_tree
          ./clear_tree

      # ------------------------------------------------------------
      # 5️⃣ Build firmware (must run under fakeroot)
      # ------------------------------------------------------------
      - name: Build firmware (no VPN)
        env:
          TNAME: YK-L1
        run: |
          cd /opt/rt-n56u/trunk
          chmod +x build_firmware_modify
          fakeroot ./build_firmware_modify $TNAME 0   # 0 = release (no debug)

      # ------------------------------------------------------------
      # 6️⃣ Collect the generated *.trx file (fixed absolute path)
      # ------------------------------------------------------------
      - name: Collect built firmware
        run: |
          mkdir -p /opt/images
          cp -f /opt/rt-n56u/trunk/images/*.trx /opt/images/

      # ------------------------------------------------------------
      # 7️⃣ Upload as CI artefact
      # ------------------------------------------------------------
      - name: Upload firmware artefact
        uses: actions/upload-artifact@v4
        with:
          name: YK-L1-no‑vpn
          path: /opt/images/*.trx
          if-no-files-found: error

      # ------------------------------------------------------------
      # 8️⃣ (Optional) Verify that no VPN flag slipped back in
      # ------------------------------------------------------------
      - name: Verify VPN really disabled
        run: |
          echo "=== .config VPN check ==="
          grep -E 'CONFIG_FIRMWARE_INCLUDE_(OPENVPN|SHADOWSOCKS|RPL2TP|SOFTETHERVPN)' .config && \
            { echo "❌ VPN flag still present!"; exit 1; } || echo "✅ .config 中所有 VPN 均为 n"
          echo "=== kernel_config VPN check ==="
          grep -E 'CONFIG_(PPP|PPTP|L2TP)' configs/boards/${{ env.TNAME }}/kernel_config && \
            { echo "❌ Kernel VPN 模块仍存在!"; exit 1; } || echo "✅ Kernel VPN 已全部删除"
